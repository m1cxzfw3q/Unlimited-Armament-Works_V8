techtree.uaw- = 无限武装工厂

# 区域 耗材

## 物品
item.uaw-item-cryogel.name = 冷冻凝胶
item.uaw-item-cryogel.description = 一种冰冷的凝胶状物体。用作热能弹药和冷却剂。
item.uaw-item-cryogel.details = 一种由冷冻液和沙子混合合成的极寒化合物。尽管温度极低，它却呈现出胶状质地。\n\n别吃它。求你了。千万别。虽然不知为何，它们的味道像薄荷果冻。

item.uaw-item-anthracite.name = 无烟煤
item.uaw-item-anthracite.description = 用于燃料和高级材料合成。发现于煤层深处。
item.uaw-item-anthracite.details = 亦称硬煤，是一种坚硬、致密的煤炭，带有亚金属光泽。\n\n在所有煤炭种类中，其碳含量最高，杂质最少，能量密度最大。

item.uaw-item-stoutsteel.name = 坚固钢合金
item.uaw-item-stoutsteel.description = 一种用于车辆制造、防御结构、弹药生产和管道安装的极其耐用的合金。
item.uaw-item-stoutsteel.details = 正式名称为"谢菲尔德合金"，这是一种由于"天坠"事件不幸遗失大部分制造工艺的合金。你手上这东西根本无法与原件相提并论。

## 气体
liquid.uaw-gas-steam.name = 蒸汽
liquid.uaw-gas-steam.description = 蒸气化水，温度极高。用于驱动各类蒸汽结构。

# 区域尾 耗材

# 区域 钻头 / 材料收集 / 泵
block.uaw-oil-derrick.name = 石油井架
block.uaw-oil-derrick.description = 从地壳下钻探石油。\n\n需要蒸汽才能运行。

block.uaw-steam-pump.name = 蒸汽泵
block.uaw-steam-pump.description = 使用高压蒸汽泵送和输出液体。

block.uaw-pulsometer-pump.name = 脉搏计泵
block.uaw-pulsometer-pump.description = 利用高压蒸汽泵送并输出大量液体。

block.uaw-steam-drill.name = 蒸汽钻机
block.uaw-steam-drill.description = 一台蒸汽驱动的钻机，能够开采钛矿石。\n可使用润滑油提高效率。

block.uaw-advanced-steam-drill.name = 高级蒸汽钻机
block.uaw-advanced-steam-drill.description = 更大、更快、更好，超越普通蒸汽钻机，能够开采更坚硬的矿石。\n可使用润滑油提高效率。

block.uaw-steam-thumper.name = 蒸汽撞击器
block.uaw-steam-thumper.description = 向地表下的煤层注入高压蒸汽，挖掘出一种称为无烟煤的高效燃料。
# endregion Drills / Material Gathering / Pump

# region Logistic

## region Heat
block.uaw-copper-heat-node.name = 铜热节点
block.uaw-copper-heat-node.description = 简单的铜制热节点，向前传输热量。

block.uaw-composite-heat-node.name = 混合热节点
block.uaw-composite-heat-node.description = 耐用的热节点，向前传输电力和热量。\n可部署在[blue]水[]上。
## endregion Heat

## region Liquid
block.uaw-pressurized-conduit.name = 坚固钢管道
block.uaw-pressurized-conduit.description = 快速向前输送液体，具有极高的流速并能处理高温液体。不会泄漏。\n\n可部署在[blue]水[]上。

block.uaw-plated-pressurized-conduit.name = 镀层坚固钢管道
block.uaw-plated-pressurized-conduit.description = 快速向前输送液体，具有极高的流速并能处理高温液体。\n不接受侧面输入。不会泄漏。\n\n可部署在[blue]水[]上。

block.uaw-pressurized-liquid-router.name = 坚固钢液体路由器
block.uaw-pressurized-liquid-router.description = 从一个方向接收液体，并平均分配到最多3个其他方向。能跟上加压管道的输出速度。重型装甲。

block.uaw-pressurized-liquid-junction.name = 坚固钢液体连接器
block.uaw-pressurized-liquid-junction.description = 快速向前输送液体。与泵和其他管道配合使用。重型装甲。

block.uaw-pressurized-liquid-bridge.name = 坚固钢液体桥梁
block.uaw-pressurized-liquid-bridge.description = 在地形或建筑物上输送液体，比标准液体桥梁更快、更远。重型装甲。
## endregion Liquid

# endregion Logistic

# region Generators

## region Power
block.uaw-petroleum-generator.name = 石油发电机
block.uaw-petroleum-generator.description = 通过燃烧石油产生大量电力。被摧毁时会爆炸。\n需要一点电力来启动过程。

block.uaw-steam-turbine.name = 蒸汽涡轮机
block.uaw-steam-turbine.description = 使用蒸汽发电。蒸汽随后被冷凝回水。

block.uaw-advanced-steam-turbine.name = 高级蒸汽涡轮机
block.uaw-advanced-steam-turbine.description = 使用蒸汽产生大量电力。蒸汽随后被冷凝回水。
## endregion Power

## region Steam
block.uaw-steam-kettle.name = 蒸汽锅炉
block.uaw-steam-kettle.description = 将水煮沸产生蒸汽。
block.uaw-steam-kettle.details = 小巧而原始，也可用来煮泡面。

block.uaw-industrial-boiler.name = 工业锅炉
block.uaw-industrial-boiler.description = 使用可燃材料煮沸水来产生蒸汽。
block.uaw-industrial-boiler.details = 强化的内部锅炉使这台机器能够使用各种可燃材料运行，前提是它们不会爆炸。

block.uaw-pressure-boiler.name = 压力锅炉
block.uaw-pressure-boiler.description = 通过使用可燃材料煮沸水，显著更高效地产生蒸汽。
block.uaw-pressure-boiler.details = 水在高压下加热，使其在沸点以上沸腾。

block.uaw-geothermal-boiler.name = 地热锅炉
block.uaw-geothermal-boiler.description = 放置在高温区域时产生蒸汽。
## endregion Steam

## region Heat
block.uaw-vapour-heater.name = 蒸汽加热器
block.uaw-vapour-heater.description = 使用蒸汽产生热量和水。

block.uaw-coal-burner.name = 燃煤加热器
block.uaw-coal-burner.description = 通过燃烧煤炭产生热量。

block.uaw-lpg-heater.name = 气体加热器
block.uaw-lpg-heater.description = 通过燃烧石油气产生热量。
## endregion Heat

# endregion Generators

# region Crafters
block.uaw-alloy-crucible.name = 合金熔炉
block.uaw-alloy-crucible.description = 混合无烟煤粉尘和其他材料，生产一种极其致密耐用的合金，称为"坚固钢"。

block.uaw-gelatinizer.name = 冷冻液凝胶化器
block.uaw-gelatinizer.description = 生产冷冻凝胶。一种非常寒冷但呈凝胶状的化合物。
block.uaw-gelatinizer.details = 通过沙子，冷冻液可以被凝胶化成冷冻凝胶，从而更方便储存和多样化使用。

block.uaw-cryofluid-blender.name = 冷冻液混合器
block.uaw-cryofluid-blender.description = 快速混合水和精细钛粉以生产冷冻液。

block.uaw-plastanium-fabricator.name = 塑钢制造机
block.uaw-plastanium-fabricator.description = 从石油和钛中快速生产塑钢。

block.uaw-steam-press.name = 蒸汽压机
block.uaw-steam-press.description = 快速将煤炭压缩成石墨。

block.uaw-petrochemical-centrifuge.name = 石油化工离心机
block.uaw-petrochemical-centrifuge.description = 将石油转化为煤炭和无烟煤。
block.uaw-petrochemical-centrifuge.details = 我不知道这是如何工作的，到了这个地步，真实性就不管了。

block.uaw-petroleum-crucible.name = 石油熔炉
block.uaw-petroleum-crucible.description = 使用石油作为燃料，以非常高的速度生产硅和超玻璃。
# endregion crafters

# region Turret

## region Machine Guns [MG]

block.uaw-quadra.name = 四联炮
block.uaw-quadra.description = 从其双平行炮管中快速发射射弹。
block.uaw-quadra.details = 双联加固的并列炮管使四联炮能够长时间维持高射速。

block.uaw-spitfire.name = 喷火炮
block.uaw-spitfire.description = 射击速度极快。仅限于地面目标。
block.uaw-spitfire.details = 以无情的凶猛释放一连串射弹。

## endregion Machine Guns [MG]

## region Shot-cannons [SG]

block.uaw-buckshot.name = 鹿弹炮
block.uaw-buckshot.description = 短程炮塔，每次射击发射多发弹丸。
block.uaw-buckshot.details = 一个安装在加固底座上的超大号霰弹枪，尽管年代久远，却有着惊人的效果。

block.uaw-tempest.name = 暴风炮
block.uaw-tempest.description = 高射速，发射多发弹丸，消耗大量弹药。\n\n优先攻击飞行敌人而非地面敌人。
block.uaw-tempest.details = 一种加特林配置的自动霰弹炮。它在火力上的不足，以效率来弥补，在其射程内释放猛烈的弹丸风暴。

block.uaw-strikeforce.name = 打击力量炮
block.uaw-strikeforce.description = 射速慢，近距离绝对具有毁灭性。
block.uaw-strikeforce.details = 打击力量炮是一种恐怖的霰弹炮，因战争犯罪问题在众多国家被禁止使用，能够以惊人的数量释放多种类型的热能化合物组成的毁灭性散射。\n\n幸运的是，那些法律不会适用于你将使用这种武器的地方以及你将对付的目标。

## endregion Shot-cannons [SG]

## region Railguns - Sniper [RG]

block.uaw-ashlock.name = 灰锁炮
block.uaw-ashlock.description = 缓慢、精准且强大。一种精确的大口径炮塔，以生命值最高的敌人为目标。
block.uaw-ashlock.details = 强大的中远程火炮，考虑到其紧凑的尺寸，具有很高的精度。

block.uaw-longbow.name = 长弓炮
block.uaw-longbow.description = 一种快速射击的炮，具有显著的精度，在远距离发射高速射弹。
block.uaw-longbow.details = 它因其剑形而得名。长弓炮是基于"灰锁"模式炮塔的升级版。使用新的、明显更好的材料使长弓炮成为许多情况下非常可靠的武器。

block.uaw-deadeye.name = 神枪手炮
block.uaw-deadeye.description = 一种极其精准的远程炮塔，以极高的速度发射射弹。\n能够一枪摧毁大多数地面目标。
block.uaw-deadeye.details = 基于"长弓"模式炮塔，它经过多次升级增强，包括一个尖端的磁力充能炮管，将其射弹加速到令人恐惧的速度。\n\n由Flin提供精灵图

## endregion Railguns - Sniper [RG]

## region Artillery [ART]

block.uaw-zounderkite.name = 轰鸣风筝炮
block.uaw-zounderkite.description = 发射地雷罐，这些罐在空中爆裂并部署各种类型的地雷。
block.uaw-zounderkite.details = 战术地雷部署系统，通常称为T.M.D.S "轰鸣风筝"。能够在几分钟内将空旷的战场变成高度饱和的雷区。\n\n由于其无差别性质，在多个地方被禁止。

block.uaw-skyhammer.name = 天锤炮
block.uaw-skyhammer.description = 向目标发射巨大且非常重的炮弹，覆盖极远距离。\n\n[accent]在受影响区域引起多次重复的余震。[]
block.uaw-skyhammer.details = "雷声响彻晴空。" \n"慢慢地，一声呼啸越来越响，云层破碎，然后死亡向我们致意。"

## endregion Artillery [ART]

## region Energy [EN]

block.uaw-heavylight.name = 重光炮
block.uaw-heavylight.description = 中程光束武器，射速高。可击中空中敌人。
block.uaw-heavylight.details = 入门级能量炮塔。与大多数同类炮塔一样，难以防御，因为它能绕过动能弹护盾。\n\n当子弹无法正常工作时，最聪明的科学家们争先恐后地寻找答案；"重光"炮是多年细致研究的结果。

block.uaw-reticence.name = 沉默炮
block.uaw-reticence.description = 释放强大的能量球，击中时暂时使敌方单位失效。
block.uaw-reticence.details = 沉默炮的能量球很少造成物理伤害。由于其较长的充能时间，射击速度也较慢，但如果运用得当，它可以迅速关闭最强大的敌人。

block.uaw-trailblazer.name = 开拓者炮
block.uaw-trailblazer.description = 快速释放高速能量弹，击中时释放电弧。
block.uaw-trailblazer.details = "开拓者"炮使用某种新技术。它给普通炮弹过载，以在击中时释放高压电弧，跳跃到多个目标。\n\n它可能对重装甲目标造成不了多大伤害，但会烧毁初始撞击点旁边或后面的无装甲敌人。

block.uaw-sundouser.name = 落日者炮
block.uaw-sundouser.description = 释放一个缓慢移动、灼热、强大的能量球，接触时将消灭最强大的对手。
block.uaw-sundouser.details = 部署缓慢且笨重，甚至在使用时倾向于成为一种负担，因为它消耗的电力巨大到足以启动。当它完成充能时，甚至可以将太阳浇灭。

## endregion Energy [EN]

# endregion Turret

# region Defense
block.uaw-force-wall.name = 力场墙
block.uaw-force-wall.description = 一种小型墙，通电时可以产生护盾。
block.uaw-force-wall.details = 它们相互插接，你不需要单独将它们连接到电源节点。

block.uaw-stoutsteel-wall.name = 坚固钢墙
block.uaw-stoutsteel-wall.description = 保护结构免受敌人射弹攻击。抗碾压伤害。
block.uaw-stoutsteel-wall-large.name = 大型坚固钢墙
block.uaw-stoutsteel-wall-large.description = 保护结构免受敌人射弹攻击。抗碾压伤害。

block.uaw-rejuvination-projector.name = 再生投射器
block.uaw-rejuvination-projector.description = 快速修复其附近建筑，并在它们的生命值达到一定百分比后额外增加其速度。

block.uaw-rejuvination-dome.name = 再生穹顶
block.uaw-rejuvination-dome.description = 快速修复其附近建筑，并在它们的生命值达到一定百分比后额外增加其速度。
# endregion Defense

# region Unit Blocks
block.uaw-air-ground-factory.name = 战争设施
block.uaw-air-ground-factory.description = 生产空中和地面载具。产出的单位可以直接使用，或者移动到重构器进行升级。
block.uaw-air-ground-factory.details = 天坠之后，我们曾经熟知的世界不再相同。和平与繁荣需要某种代价，那就是鲜血与石油。

block.uaw-naval-factory.name = 海军船坞
block.uaw-naval-factory.description = 生产海军舰艇。产出的单位可以直接使用，或者移动到重构器进行升级。
block.uaw-naval-factory.details = 天坠事件揭示了新的陆地，同时淹没了其他地区，虽然人类几个世纪前已经驯服了广阔的海洋，但在新时代，情况不会有什么不同。

block.uaw-drone-factory.name = 自动化装配场
block.uaw-drone-factory.description = 生产各种自动化机械，以协助建造、物流或支援。
block.uaw-drone-factory.details = 血肉之躯无法完成的，钢铁接手。

block.uaw-exponential-petroleum-reconstructor.name = 指数石油重构器
block.uaw-exponential-petroleum-reconstructor.description = 将人族3级单位升级为4级。\n[accent]可部署在[blue]水[]上。

block.uaw-tetrative-petroleum-reconstructor.name = 四重石油重构器
block.uaw-tetrative-petroleum-reconstructor.description = 将人族4级单位升级为5级。\n[accent]可部署在[blue]水[]上。

block.uaw-pentative-petroleum-reconstructor.name = 五重石油重构器
block.uaw-pentative-petroleum-reconstructor.description = 将人族5级单位升级为6级。\n[accent]可部署在[blue]水[]上。
# endregion Unit Blocks

# region Unit - Air

## region Air - Attack Helicopter

unit.uaw-crotchety.name = 暴躁者
unit.uaw-crotchety.description = 小型直升机，携带一门不成比例的大型火炮，发射低温射弹用于近距地面支援。
unit.uaw-crotchety.details = 迟缓且脆弱，人们会想知道是谁想出在这个东西上安装这么大一门炮的绝妙主意。

unit.uaw-aglovale.name = 阿格洛瓦勒
unit.uaw-aglovale.description = 快速攻击直升机，用一连串机枪射击和火箭弹扫射敌人。
unit.uaw-aglovale.details = 旧世界的遗产，那时活塞发动机和石油统治着天空。

unit.uaw-bedivere.name = 贝德维尔
unit.uaw-bedivere.description = 扫射敌方单位，其旋翼会残酷地撕裂靠近的敌人单位。
unit.uaw-bedivere.details = 其旋翼叶片由特殊的复合合金制成，并辅以独特的制造工艺，叶片经过锻造，赋予其非常剑状的外观和功能。

unit.uaw-calogrenant.name = 卡洛格伦南特
unit.uaw-calogrenant.description = 中等装甲，武装到牙齿，从上方降下毁灭。
unit.uaw-calogrenant.details = 阿尔比恩皇家空军的标准攻击直升机，其武器装备释放着女王陛下的怒火。

unit.uaw-dagonet.name = 达格内特
unit.uaw-dagonet.description = 以无与伦比的凶猛释放穿甲燃烧弹，以及无尽的无情导弹蜂群，确保连灰烬都不会留下。\n\n由于其携带的大量火力，其旋翼产生强烈的下冲气流，推开附近的敌人。
unit.uaw-dagonet.details = 天空的威胁，苍穹的征服者，阿尔比恩工程的巅峰。

unit.uaw-esclabor.name = 埃斯克拉博
unit.uaw-esclabor.description = 对你的敌人释放无差别的审判。
unit.uaw-esclabor.details = 强大、无情且坚不可摧。旨在承受并扭转最压倒性的对手。
## endregion Air - Attack Helicopter

## region Air - Airships & Carriers
unit.uaw-cantankerous.name = 易怒者
unit.uaw-cantankerous.description = 中型且有一定装甲的飞艇。以短促的两连发模式发射低温射弹。\n\n此外，它发射装有低温弹头的巡航导弹。
unit.uaw-cantankerous.details = 它曾是阿尔比恩工程师的骄傲，新天空的前统治者，一旦战争演变，很快就过时了。

unit.uaw-illustrious.name = 辉煌者
unit.uaw-illustrious.description = 制造并发射自爆旋翼机无人机。它有几挺机枪用于自卫。
unit.uaw-illustrious.details = 辉煌级飞行母舰，在易怒者飞艇过时后匆忙建造。\n\n其设计基于这样一个想法：在飞船上安装大炮是个糟糕的主意，取而代之的是，其船体装载了由低温化合物制成的旋翼机无人机。\n\n人们会想知道其工程师的思路是如何导致这一点的。

unit.uaw-indefatigable.name = 不倦者
unit.uaw-indefatigable.description = 制造并发射一系列自主空中无人机，这些无人机无情地射击子弹。有几挺机枪和点防御武器用于自卫。
unit.uaw-indefatigable.details = 不倦级飞行母舰诞生于辉煌级飞行母舰的可怕且昂贵的结果之后，拥有更厚的装甲板，更强的旋翼轴，以及射击而非撞击敌人的旋翼机无人机。

unit.uaw-indomitable.name = 不屈者
unit.uaw-indomitable.description = 一艘能够向战场释放永恒冬季的飞行战舰，同时也制造支持附近单位的自主旋翼机。
# unit.uaw-indomitable.details =

## endregion Air - Anti Building

## region Air - Jets
unit.uaw-corsair.name = 海盗船
unit.uaw-corsair.description = 向目标发射激光制导炸弹，对建筑物造成更多伤害。
unit.uaw-corsair.details = 命名为海盗船FB.15，它是一种高性能战斗轰炸机，适合摧毁地面目标，尽管需要时也可以作为空中优势战斗机使用。

unit.uaw-vindicator.name = 辩护者
unit.uaw-vindicator.description = 发射激光制导炸弹，在其受影响区域引起重复余震。
unit.uaw-vindicator.details = 辩护者FB.30比其前身飞得更快更高。没有适当的防空系统很难拦截。

unit.uaw-superfortress.name = 超级堡垒
unit.uaw-superfortress.description = 对目标执行毁灭性轰炸。
unit.uaw-superfortress.details = 超级堡垒B(I).45是一种高度耐用的飞机。其发动机可以举起比自身重量重得多的有效载荷，尽管与其前身相比略显迟缓。

unit.uaw-stratofortress.name = 同温层堡垒
unit.uaw-stratofortress.description = 向地面目标投掷毁灭性炸弹。
unit.uaw-stratofortress.details = 超级堡垒B(I).45的升级版，命名为同温层堡垒B(I).90，是一种远程轰炸机，尽管体型和重量巨大，却能以惊人的速度飞行。
## endregion Air - Bomber

# endregion Unit - Air

# region Unit - Naval

## region Naval - Monitor Warship
unit.uaw-arquebus.name = 火绳枪炮舰
unit.uaw-arquebus.description = 小型且迟缓。携带双联火炮，对建筑物造成更多伤害。

unit.uaw-carronade.name = 卡隆炮舰
unit.uaw-carronade.description = 向敌方防御工事发射齐射炮弹。

unit.uaw-falconet.name = 鹰炮舰
unit.uaw-falconet.description = 装备了更多的点防御武器以及更具毁灭性的火炮。\n\n主炮在其受影响区域引起[white]重复余震[]，[white]在效果持续期间阻止任何建筑被建造[]。
## endregion Naval - Monitor Warship

## region Naval - Torpedo Destroyers
unit.uaw-megaera.name = 墨盖拉
unit.uaw-megaera.description = 迅捷且强大，装备点防御炮和单管鱼雷发射器。
unit.uaw-alecto.name = 阿勒克图
unit.uaw-alecto.description = 装备机枪、导弹发射器和双联前向鱼雷发射器。
unit.uaw-tisiphone.name = 提西福涅
unit.uaw-tisiphone.description = 灵活但中等装甲，发射威力强大的鱼雷和反舰巡航导弹。
## endregion Naval - Torpedo Destroyers

