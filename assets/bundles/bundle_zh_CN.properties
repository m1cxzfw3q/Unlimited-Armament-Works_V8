## region Ground - Main Battle Tanks
unit.uaw-cavalier.name = 骑士
unit.uaw-cavalier.description = 向目标发射高爆弹和一连串子弹。\n\n在液体和泥泞地形上受到的移动惩罚较小。

unit.uaw-centurion.name = 百夫长
unit.uaw-centurion.description = 向目标发射穿甲弹、导弹和一连串子弹。\n\n在液体和泥泞地形上受到的移动惩罚较小。

unit.uaw-caernarvon.name = 卡那封
unit.uaw-caernarvon.description = 向目标发射强大的穿甲复合"飞镖"，可无视装甲并穿透力场护盾，也发射导弹并用子弹扫射敌人。\n\n拥有非常厚的复合装甲，使大多数来袭炮弹无效。\n\n在液体和泥泞地形上受到的移动惩罚较小。
## endregion Ground - Main Battle Tanks

